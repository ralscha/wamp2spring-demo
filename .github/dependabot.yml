# Weekly version updates; security updates are enabled in repository settings.
# Minor and patch releases are grouped; major releases remain separate.
version: 2
updates:
- package-ecosystem: docker-compose
  directory: /session
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: maven
  directories:
  - /bandwidth
  - /datachannel
  - /earthquake
  - /fiddle
  - /gauge
  - /geotracker
  - /iss
  - /maps
  - /mobile-chat
  - /pirate
  - /reactive
  - /session
  - /simple-chat
  - /smoothie
  - /snake
  - /tail
  - /worldchat
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directories:
  - /geotracker/client
  - /mobile-chat/client
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
